<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#160706">
  <title>ANA CHEF | روابطنا الرسمية</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      background:radial-gradient(ellipse at top,#5b100b 0%,#210907 48%,#080606 100%);
      color:#fff;font-family:Tahoma,Arial,sans-serif}
    .card{width:min(100%,430px);padding:30px 24px 26px;border:2px solid #dca91c;
      border-radius:28px;background:linear-gradient(160deg,#17100d 0%,#390b08 55%,#120807 100%);
      box-shadow:0 0 0 5px #6c420b,0 18px 60px #000b;text-align:center}
    .mark{width:94px;height:94px;margin:0 auto 14px;border-radius:50%;
      display:grid;place-items:center;border:3px solid #f3c52d;
      background:radial-gradient(circle,#4b100b,#090707 70%);
      color:#ffd32e;font-size:37px;font-weight:900;text-shadow:0 2px 8px #000}
    h1{margin:0;color:#ffd33b;font-size:34px;letter-spacing:1px}
    .tag{margin:9px 0 25px;color:#f5e6c1;font-size:15px;line-height:1.8}
    .links{display:grid;gap:13px}
    a{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 18px;
      border-radius:15px;text-decoration:none;color:#fff;font-size:18px;font-weight:700;
      border:1px solid #f5d46a;box-shadow:0 5px 0 #0006;transition:transform .15s}
    a:active{transform:translateY(2px)}
    .fb{background:#1877f2}.ig{background:linear-gradient(110deg,#833ab4,#c13584,#f77737)}
    .wa{background:#168b50}
    .ico{width:25px;height:25px;display:inline-grid;place-items:center;font-size:21px}
    .handle{margin-top:23px;color:#e9c66a;font-size:13px;letter-spacing:.5px}
    .foot{margin-top:10px;color:#bda98d;font-size:11px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">AC</div>
    <h1>ANA CHEF</h1>
    <p class="tag">سر الطعم المميز في كل أكلة<br>تابعنا وتواصل معنا</p>
    <nav class="links" aria-label="روابط أنا شيف">
      <a class="fb" href="https://www.facebook.com/anachef.eg/" target="_blank" rel="noopener">
        <span class="ico">f</span><span>تابعنا على Facebook</span>
      </a>
      <a class="ig" href="https://www.instagram.com/anachef.eg/?hl=ar" target="_blank" rel="noopener">
        <span class="ico">◎</span><span>تابعنا على Instagram</span>
      </a>
      <a class="wa" href="https://wa.me/201021291053" target="_blank" rel="noopener">
        <span class="ico">✆</span><span>تواصل معنا على WhatsApp</span>
      </a>
    </nav>
    <div class="handle">@anachef.eg</div>
    <div class="foot">ANA CHEF · Official links</div>
  </main>
</body>
</html>
